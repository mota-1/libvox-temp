[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "libvox-sync"
version = "0.1.0"
description = "ETL worker that populates the LibVox Discovery Index"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"

# The copyright holder, which PEP 621 gives no field of its own. IMPA Tech holds
# it, together with the LibVox team; the second entry is the technical contact.
# Worth stating in the metadata rather than only in prose: the commercial
# exception to the licence above is IMPA Tech's to grant, and nobody else's.
authors = [
    { name = "IMPA Tech" },
    { name = "Anselmo Luiz Éden Battisti", email = "anselmo.battisti@impatech.edu.br" },
]

# Keep in sync with requirements.txt.
# libvox-driver-koha is a sibling in this repository, not a published package.
# Install it first, editable, or this one cannot resolve:
#
#     pip install -e ../libvox-driver-koha
#
# It is a hard dependency, not an optional integration: without a driver there
# is nothing to extract. httpx2 comes with it and is no longer listed here.
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "libvox-driver-koha>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6,<0.17"]

[project.scripts]
libvox-sync = "libvox_sync.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/libvox_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

# The rule set is stated rather than inherited. Ruff's default selection has
# widened across releases, so an unpinned `ruff` silently changes what CI
# enforces — new findings appear in code nobody touched. Widening this list is
# a deliberate change with its own PR.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
