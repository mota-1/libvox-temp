# Conda environment for /libvox-sync
#
#   conda env create -f environment.yml
#   conda activate libvox-sync
#   pip install -e ".[dev]"

name: libvox-sync

channels:
  - conda-forge
  # Anaconda's own channels now answer 429 without client registration, so an
  # accidental fall-through to `defaults` fails the whole solve.
  - nodefaults

dependencies:
  - python=3.12
  - pip
  - pip:
      - -r requirements-dev.txt
