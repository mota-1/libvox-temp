[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "libvox-driver-koha"
version = "0.1.0"
description = "Koha integration driver for LibVox"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"

# The copyright holder, which PEP 621 gives no field of its own. IMPA Tech holds
# it, together with the LibVox team; the second entry is the technical contact.
# Worth stating in the metadata rather than only in prose: the commercial
# exception to the licence above is IMPA Tech's to grant, and nobody else's.
authors = [
    { name = "IMPA Tech" },
    { name = "Anselmo Luiz Éden Battisti", email = "anselmo.battisti@impatech.edu.br" },
]

# Keep in sync with requirements.txt.
dependencies = [
    "httpx2>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6,<0.17"]

[project.scripts]
libvox-driver-koha = "libvox_driver_koha.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/libvox_driver_koha"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

# The rule set is stated rather than inherited. Ruff's default selection has
# widened across releases, so an unpinned `ruff` silently changes what CI
# enforces — new findings appear in code nobody touched. Widening this list is
# a deliberate change with its own PR.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
